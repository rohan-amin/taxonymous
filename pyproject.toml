[project]
name = "taxonymous"
version = "0.1.0"
description = "Scrub personal identifiers from tax documents locally before sharing them with an AI assistant."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "rma", email = "69166804+rohan-amin@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
taxonymous = "taxonymous.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fonttools>=4.67.0",
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: long-running acceptance tests (run with: uv run pytest -m slow)"]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
